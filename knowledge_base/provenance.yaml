  "assumptions": [
    {
      "id": "A_MAGNITUDE_INPUT",
      "description": "Accept a supplied semi-quantitative magnitude in [0,10]. Zero means no detected exposure for this case. These are synthetic scenario inputs, not reconstructed concentration units or thresholds."
    },
    {
      "id": "A_SCORE_PRODUCT",
      "description": "Direct impact score = supplied magnitude times documented importance. Product scoring is a POC choice, not a recovered ESC algorithm."
    },
    {
      "id": "A_PRIORITY_BANDS",
      "description": "Maximum direct score: 0=no_detected_impact; (0,10)=monitor; [10,40)=mitigate; [40,100]=urgent_review. These action categories and cutoffs are POC assumptions, not historical or regulatory outcomes."
    },
    {
      "id": "A_INDIRECT_CHAIN",
      "description": "Follow the selected directed environmental links for at most two hops, only to receptors supplied as present. Intermediate nodes may be outside the listed receptors; start from a documented direct impact to a listed receptor. Do not assign numerical scores to indirect effects."
    },
    {
      "id": "A_CASE_SCOPE",
      "description": "A case selects one pollutant, one or more source processes and the site receptors. Join emission and impact relations, use the maximum direct score, recommend known mitigations for the sources when magnitude is positive. Do not infer negative effects from absent facts."
    },
    {
      "id": "A_DATA_GAPS",
      "description": "A receptor with neither a direct relation nor a selected indirect path has insufficient evidence. Decision becomes insufficient_data, retaining known impacts and priority. No assessment of unlisted receptors is claimed."
    },
    {
      "id": "A_SOCIAL_CONTEXT",
      "description": "Report documented process-driven social pathways as contextual potential effects, independent of selected pollutant magnitude. They do not contribute to the numerical priority."
    },
    {
      "id": "A_STANDARD_INTERVAL",
      "description": "Historical units are unspecified. Interpret H2S bounds as lower-inclusive/upper-exclusive except final 1000 inclusive; SO2 snippet covers [0,40]. Do not extrapolate uncovered concentrations. Input uses source_scale, not a claimed physical concentration unit."
    },
    {
      "id": "A_DETECTION_LIMIT",
      "description": "Observed value >= documented minimum detection is measurable. The source provides instrument facts but no recovered classification algorithm."
    },
    {
      "id": "A_WP_RECONSTRUCTION",
      "description": "Create a complete 20-criterion POC: count bands use 0=N, 1=S, >=2=L; ratio bands use 0=N, (0,1)=S, >=1=L. Explicit yes/no and fixed yes/no map to L/N. Specificity assumes components/impacts. This is deliberately inferred, not recovered."
    },
    {
      "id": "A_WP_AGGREGATION",
      "description": "Map N,S,L to 0,1,2; aspect mean <0.5=N, <1.5=S, otherwise L. No historical aspect aggregation or overall approval is claimed."
    },
    {
      "id": "A_BACKWARD_TRACE",
      "description": "Reverse the executable directed paths to enumerate candidate pollutants and source processes, never conclude that an observed receptor proves a cause."
    },
    {
      "id": "A_SOCIAL_GAPS",
      "description": "Keep process/social effects even if no documented consequence text exists; return an empty consequences list, explicitly recorded as unresolved social factors."
    },
    {
      "id": "A_SESSION_COUNTS",
      "description": "Derive session statistics from repeated Prolog case reports: count positive direct effects per analysis, distinct listed receptors/processes, and maximum-score direct effects as highlighted issues. These aggregation conventions are inferred; user supplies observation objectivity, staged activity, alternatives, declared assumptions and rare-severe-impact counts."
    },
    {
      "id": "A_AMBIENT_SCREEN",
      "description": "Screen a supplied complete summary against the explicitly selected current US EPA table row. Do not derive regulatory design values from raw measurements, verify completeness claims, apply mandated rounding, determine legal attainment, or apply US limits to another jurisdiction. Equality is within reference; strictly above exceeds reference. Context, statistic, completeness and reference threshold must match; otherwise abstain. Historical importance/magnitude values are not modernized or recalibrated."
    },
    {
      "id": "A_AMBIENT_COUNTS",
      "description": "For CO compare the supplied annual count of concentrations strictly above the row level with one; for PM10 compare the supplied three-year mean of annual exceedance counts with one. A concentration value alone cannot establish these frequency-based outcomes. These summaries must be computed for the exact reference threshold."
    },
    {
      "id": "A_AMBIENT_UNITS",
      "description": "Accept ppb/ppm by volume (factor 1000) and ug/m3/mg/m3 (factor 1000); no gas-volume to mass conversion without physical conditions. Count summaries use count_per_year. Reference-level equality allows only conversion roundoff (max absolute 1e-9, relative 1e-12), not regulatory rounding; decision comparisons remain strict."
    }
  ],
